    <path d="M64 128 C58 78 82 44 120 44 C158 44 182 78 176 128 C174 150 168 168 160 182 L156 150 C160 118 156 84 120 84 C84 84 80 118 84 150 L80 182 C72 168 66 150 64 128 Z" fill="#43301f"/>

