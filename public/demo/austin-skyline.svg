<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="skyb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101d38"/>
      <stop offset="0.55" stop-color="#243a63"/>
      <stop offset="0.82" stop-color="#3c5680"/>
      <stop offset="1" stop-color="#516d99"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.74" cy="0.72" r="0.4">
      <stop offset="0" stop-color="#f4c089" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#f4c089" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#skyb)"/>
  <rect width="1200" height="600" fill="url(#glow)"/>

  <!-- distant hazy skyline -->
  <g fill="#2b4067" opacity="0.65">
    <rect x="40"  y="360" width="70"  height="240"/>
    <rect x="150" y="330" width="54"  height="270"/>
    <rect x="250" y="380" width="80"  height="220"/>
    <rect x="900" y="350" width="66"  height="250"/>
    <rect x="1000" y="320" width="60" height="280"/>
    <rect x="1090" y="370" width="80" height="230"/>
  </g>

  <!-- main skyline -->
  <g fill="#0c1730">
    <rect x="70"  y="300" width="86"  height="300"/>
    <rect x="180" y="250" width="70"  height="350"/>
    <rect x="270" y="330" width="60"  height="270"/>
    <!-- tapered tower with spire (Austin landmark feel) -->
    <path d="M360 600 L360 210 L385 150 L410 210 L410 600 Z"/>
    <rect x="381" y="96" width="8" height="60"/>
    <rect x="440" y="290" width="78" height="310"/>
    <rect x="540" y="240" width="64" height="360"/>
    <rect x="620" y="330" width="92" height="270"/>
    <!-- second tall tower with crown -->
    <rect x="730" y="200" width="72" height="400"/>
    <path d="M730 200 L766 168 L802 200 Z"/>
    <rect x="820" y="300" width="70" height="300"/>
    <rect x="905" y="260" width="58" height="340"/>
    <rect x="980" y="330" width="86" height="270"/>
    <rect x="1080" y="290" width="70" height="310"/>
  </g>

  <!-- lit windows -->
  <g fill="#ffd9a0" opacity="0.5">
    <rect x="196" y="272" width="6" height="8"/><rect x="212" y="272" width="6" height="8"/><rect x="228" y="272" width="6" height="8"/>
    <rect x="196" y="300" width="6" height="8"/><rect x="212" y="300" width="6" height="8"/><rect x="228" y="300" width="6" height="8"/>
    <rect x="196" y="330" width="6" height="8"/><rect x="228" y="330" width="6" height="8"/>
    <rect x="556" y="270" width="6" height="8"/><rect x="572" y="270" width="6" height="8"/><rect x="588" y="270" width="6" height="8"/>
    <rect x="556" y="300" width="6" height="8"/><rect x="588" y="300" width="6" height="8"/>
    <rect x="556" y="336" width="6" height="8"/><rect x="572" y="336" width="6" height="8"/>
    <rect x="746" y="240" width="6" height="9"/><rect x="764" y="240" width="6" height="9"/><rect x="782" y="240" width="6" height="9"/>
    <rect x="746" y="272" width="6" height="9"/><rect x="782" y="272" width="6" height="9"/>
    <rect x="746" y="308" width="6" height="9"/><rect x="764" y="308" width="6" height="9"/><rect x="782" y="308" width="6" height="9"/>
    <rect x="920" y="292" width="6" height="8"/><rect x="936" y="292" width="6" height="8"/>
    <rect x="920" y="322" width="6" height="8"/><rect x="936" y="322" width="6" height="8"/>
  </g>
